{{define "admin_staff_form.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} · Клиника</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{template "nav" .}}
  <main>
    {{if .FlashError}}<div class="flash flash-error">{{.FlashError}}</div>{{end}}
    <h1>{{.Title}}</h1>
    <div class="panel">
      {{if .Staff.ID}}
      <form method="post" action="/admin/staff/{{.Staff.ID}}">
      {{else}}
      <form method="post" action="/admin/staff">
      {{end}}
        <div class="form-grid">
          <div><label>ФИО *</label><input name="full_name" required value="{{index .Form "full_name"}}"></div>
          <div>
            <label>Тип *</label>
            <select name="staff_kind">
              <option value="doctor" {{if eq (index .Form "staff_kind") "doctor"}}selected{{end}}>врач</option>
              <option value="nurse" {{if eq (index .Form "staff_kind") "nurse"}}selected{{end}}>медсестра</option>
            </select>
          </div>
          <div><label>Специальность (для врача)</label><input name="specialty" value="{{index .Form "specialty"}}"></div>
          <div><label>Отделение *</label><input name="department" required value="{{index .Form "department"}}"></div>
          <div><label>График</label><input name="work_schedule" value="{{index .Form "work_schedule"}}"></div>
          <div><label>Кабинет</label><input name="office" value="{{index .Form "office"}}"></div>
          <div>
            <label class="label-with-tip">Пол
              <span class="tip" tabindex="0" data-tip="Если фото не задано — на сайте женская или мужская заглушка по полу.">?</span>
            </label>
            <select name="gender">
              <option value="" {{if eq (index .Form "gender") ""}}selected{{end}}>— не указан</option>
              <option value="f" {{if eq (index .Form "gender") "f"}}selected{{end}}>женщина</option>
              <option value="m" {{if eq (index .Form "gender") "m"}}selected{{end}}>мужчина</option>
            </select>
          </div>
          <div>
            <label class="label-with-tip">Фото
              <span class="tip" tabindex="0" data-tip="Ссылка на изображение (https://… или путь вида /static/img/фото.jpg). Если пусто — заглушка по полу.">?</span>
            </label>
            <input name="image_url" value="{{index .Form "image_url"}}">
          </div>
        </div>
        <div class="form-actions">
          <button type="submit">Сохранить</button>
          <a class="btn secondary" href="/admin/staff">Отмена</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
{{end}}
