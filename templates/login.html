{{define "login.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · Клиника</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/public.css">
</head>
<body>
  <div class="login-layout">
    <div class="login-side" style="--login-image:url('/static/img/hero.jpg')">
      <h1>Кабинет персонала</h1>
    </div>
    <div class="login-box">
      <form class="login-card" method="post" action="/login">
        <p class="eyebrow">Персонал</p>
        <h2>Вход в систему</h2>
        {{if .FlashError}}<div style="background:#fdecea;border:1px solid #f0c2bc;padding:.75rem;border-radius:8px;margin-bottom:1rem">{{.FlashError}}</div>{{end}}
        <label for="login">Логин</label>
        <input id="login" name="login" required autocomplete="username">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
        <button class="btn btn-primary btn-wide" type="submit">Войти</button>
        <p class="hint" style="margin-top:1rem;margin-bottom:0">Пациентам: <a href="/">открыть сайт клиники</a></p>
      </form>
    </div>
  </div>
</body>
</html>
{{end}}
