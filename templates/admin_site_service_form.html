{{define "admin_site_service_form.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} · Клиника</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  {{template "nav" .}}
  <main>
    {{if .FlashError}}<div class="flash flash-error">{{.FlashError}}</div>{{end}}
    <div class="page-head">
      <h1>{{.Title}}</h1>
      <p><a href="/admin/site-services">← к списку</a></p>
    </div>
    {{if .Service.ID}}
    <form class="panel" method="post" action="/admin/site-services/{{.Service.ID}}" style="max-width:720px">
    {{else}}
    <form class="panel" method="post" action="/admin/site-services" style="max-width:720px">
    {{end}}
      <label class="label-with-tip">Код страницы
        <span class="tip" tabindex="0" data-tip="Короткий адрес услуги в ссылке, латиницей: например terapevt → /services/terapevt">?</span>
      </label>
      <input name="slug" required value="{{.Form.slug}}">
      <label>Название</label>
      <input name="title" required value="{{.Form.title}}">
      <label>Краткое описание</label>
      <input name="summary" value="{{.Form.summary}}">
      <label>Текст</label>
      <textarea name="body" rows="5">{{.Form.body}}</textarea>
      <label>Цена от (₽)</label>
      <input name="price_from" type="number" value="{{.Form.price_from}}">
      <label class="label-with-tip">Фото
        <span class="tip" tabindex="0" data-tip="Ссылка на картинку: полный https://… или путь /static/img/имя.jpg. Пустое значение — стандартная заглушка.">?</span>
      </label>
      <input name="image_url" value="{{.Form.image_url}}">
      {{if .Form.image_url}}<p><img src="{{.Form.image_url}}" alt="" style="max-width:240px;border-radius:10px"></p>{{end}}
      <label>Порядок сортировки</label>
      <input name="sort_order" type="number" value="{{.Form.sort_order}}">
      <label><input type="checkbox" name="is_featured" value="1" {{if eq .Form.is_featured "1"}}checked{{end}}> На главной</label>
      <label><input type="checkbox" name="is_published" value="1" {{if eq .Form.is_published "1"}}checked{{end}}> Опубликовано</label>
      <button type="submit">Сохранить</button>
    </form>
  </main>
</body>
</html>
{{end}}
